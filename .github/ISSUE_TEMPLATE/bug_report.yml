name: Bug report
description: Report a bug in Java Maintainer Kit
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Commands, OS, JDK version, and sample repo if possible
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JMK version / commit
    validations:
      required: true
