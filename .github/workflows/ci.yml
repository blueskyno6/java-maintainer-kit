name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Self-analyze against previous commit
        if: github.event_name == 'push'
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            mvn -B -q -pl jmk-cli -am package -DskipTests
            java -jar jmk-cli/target/jmk-cli.jar analyze --base HEAD~1 --head HEAD --output jmk-self-report.md
            cat jmk-self-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  self-check-action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Java Maintainer Kit on itself
        uses: ./
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD
          comment-on-pr: 'true'
          # Exercise PR code paths; consumers should keep the default (download release jar).
          build-from-source: 'true'
